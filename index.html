<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M1S · SOP Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%232f9bd6%27/%3E%3Cstop offset=%271%27 stop-color=%27%231b6fae%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x=%274%27 y=%274%27 width=%2756%27 height=%2756%27 rx=%2714%27 fill=%27url(%23g)%27/%3E%3Crect x=%2716%27 y=%2718%27 width=%2732%27 height=%275%27 rx=%272.5%27 fill=%27white%27 opacity=%27.95%27/%3E%3Crect x=%2716%27 y=%2730%27 width=%2732%27 height=%275%27 rx=%272.5%27 fill=%27white%27 opacity=%27.7%27/%3E%3Crect x=%2716%27 y=%2742%27 width=%2722%27 height=%275%27 rx=%272.5%27 fill=%27white%27 opacity=%27.45%27/%3E%3C/svg%3E">

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<style>
  :root{
    --ink:#16202c; --muted:#5f6c7d;
    --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.45);
    --edge:rgba(255,255,255,.75); --shadow:0 8px 32px rgba(31,45,75,.12);
    --design:#f2734a; --sales:#e0a92e; --production:#2f9bd6;
    --logistics:#36a37a; --finance:#9466d6; --hr:#d6608f; --accentink:#1b6fae;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    color:var(--ink); overflow-x:hidden;
    background:linear-gradient(135deg,#e8f0fa 0%,#f3eef9 45%,#eaf6f1 100%);
  }
  #bgArt{position:fixed; inset:0; z-index:0; opacity:.55; pointer-events:none}
  .glass{
    background:var(--glass); backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid var(--edge); box-shadow:var(--shadow); border-radius:20px;
  }

  /* ---------- Login gate ---------- */
  #gate{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:20px;
    background:linear-gradient(135deg,#e8f0fa 0%,#f3eef9 45%,#eaf6f1 100%)}
  .gate-card{max-width:380px; width:100%; padding:42px 40px; text-align:center}
  .gate-card .logo{font-size:13px; letter-spacing:.35em; font-weight:700; color:var(--accentink); margin-bottom:14px}
  .gate-card h2{font-size:24px; font-weight:700; letter-spacing:-.4px; margin-bottom:8px}
  .gate-card p{font-size:13.5px; color:var(--muted); line-height:1.55; margin-bottom:24px}
  .gate-card button{
    font-family:inherit; font-size:14px; font-weight:600; padding:12px 28px; border-radius:13px;
    border:1px solid var(--edge); cursor:pointer; color:#fff;
    background:linear-gradient(135deg,#2f9bd6,#1b6fae); box-shadow:0 6px 20px rgba(31,111,174,.35);
    transition:.15s;
  }
  .gate-card button:hover{transform:translateY(-1px); box-shadow:0 9px 26px rgba(31,111,174,.45)}
  .gate-err{margin-top:14px; font-size:12px; color:#b4452f; min-height:16px}
  .gate-sub{margin-top:18px; font-size:11px; color:var(--muted)}

  /* ---------- App shell ---------- */
  #app{position:relative; z-index:1; min-height:100vh; padding:26px clamp(14px,3vw,38px)}
  header.bar{display:flex; align-items:center; gap:16px; padding:16px 22px; margin-bottom:22px}
  .brand{font-size:12px; letter-spacing:.32em; font-weight:700; color:var(--accentink)}
  .brand b{color:var(--ink)}
  h1{font-size:19px; font-weight:700; letter-spacing:-.3px}
  .who{margin-left:auto; text-align:right; font-size:12.5px; color:var(--muted)}
  .who b{color:var(--ink); font-weight:600}
  .role-pill{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.08em; padding:3px 9px;
    border-radius:8px; background:rgba(47,155,214,.14); color:var(--accentink); margin-left:7px}
  .signout{font-size:11.5px; color:var(--muted); text-decoration:underline; cursor:pointer; background:none; border:none; font-family:inherit}

  .layout{display:grid; grid-template-columns:210px 1fr; gap:22px; align-items:start}
  @media(max-width:760px){.layout{grid-template-columns:1fr}}
  .side{padding:16px 12px; position:sticky; top:20px}
  .side h2{font-size:10.5px; text-transform:uppercase; letter-spacing:.16em; color:var(--muted); margin:2px 10px 10px}
  .nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:13px; cursor:pointer;
    font-size:14px; font-weight:500; margin-bottom:3px; transition:.13s; border:1px solid transparent}
  .nav-item:hover{background:var(--glass2); border-color:var(--edge)}
  .nav-item.active{background:rgba(255,255,255,.85); border-color:var(--edge); box-shadow:0 4px 14px rgba(31,45,75,.10)}
  .dot{width:9px;height:9px;border-radius:50%; flex:0 0 auto}
  .nav-count{margin-left:auto; font-size:11px; color:var(--muted)}

  .content{padding:26px 30px; min-height:60vh}
  .dept-title{font-size:24px; font-weight:700; letter-spacing:-.4px; margin-bottom:4px}
  .dept-sub{font-size:13px; color:var(--muted); margin-bottom:20px}

  .sop{width:100%; text-align:left; font-family:inherit; background:rgba(255,255,255,.7); border:1px solid var(--edge);
    border-left:4px solid var(--accent,#2f9bd6); border-radius:15px; padding:15px 17px; cursor:pointer;
    display:block; margin-bottom:11px; transition:.15s; color:var(--ink)}
  .sop:hover{transform:translateX(3px); box-shadow:0 6px 18px rgba(31,45,75,.12); background:rgba(255,255,255,.9)}
  .sop-name{font-size:14.5px; font-weight:600; display:flex; justify-content:space-between; gap:10px; align-items:center}
  .badge{font-size:10px; font-weight:700; letter-spacing:.05em; padding:3px 8px; border-radius:7px; white-space:nowrap}
  .badge.view{background:rgba(54,163,122,.15); color:#1d7a55}
  .badge.todo{background:rgba(224,169,46,.16); color:#9a6e0d}
  .sop-desc{font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.5}

  /* ---------- Decision flow ---------- */
  .flowwrap{margin-top:28px; padding-top:20px; border-top:1px dashed rgba(95,108,125,.35)}
  .flowwrap h3{font-size:16px; font-weight:700; margin-bottom:3px}
  .fsub{font-size:12.5px; color:var(--muted); margin-bottom:14px}
  .qcard{padding:20px 22px; max-width:540px}
  .qstep{font-size:10.5px; font-weight:700; letter-spacing:.14em; color:var(--accentink); margin-bottom:8px}
  .qtext{font-size:15.5px; font-weight:600; margin-bottom:15px}
  .qbtns{display:flex; gap:9px; flex-wrap:wrap}
  .qbtn{font-family:inherit; font-size:13px; font-weight:500; padding:9px 16px; border-radius:12px;
    border:1px solid var(--edge); background:rgba(255,255,255,.75); cursor:pointer; transition:.13s}
  .qbtn:hover{background:#fff; transform:translateY(-1px); box-shadow:0 4px 12px rgba(31,45,75,.1)}
  .qrestart{margin-top:13px; font-size:12px; color:var(--muted); background:none; border:none; cursor:pointer; text-decoration:underline; font-family:inherit}
  .rlabel{font-size:12px; color:var(--muted); margin-bottom:8px}

  /* ---------- In-page viewer ---------- */
  #viewer{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; padding:3vh 3vw;
    background:rgba(22,32,44,.45); backdrop-filter:blur(6px)}
  #viewer.open{display:flex}
  .v-card{width:min(1100px,96vw); height:92vh; display:flex; flex-direction:column; overflow:hidden; border-radius:20px}
  .v-head{display:flex; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--edge)}
  .v-title{font-size:14px; font-weight:600}
  .v-actions{margin-left:auto; display:flex; gap:8px}
  .v-actions button,.v-actions a{font-family:inherit; font-size:12px; font-weight:600; padding:7px 13px; border-radius:10px;
    border:1px solid var(--edge); background:rgba(255,255,255,.8); cursor:pointer; color:var(--ink); text-decoration:none}
  .v-body{flex:1; background:#fff}
  .v-body iframe{width:100%; height:100%; border:0}
  .v-msg{display:flex; height:100%; align-items:center; justify-content:center; color:var(--muted); font-size:14px; text-align:center; padding:30px}

  .denied{padding:40px; text-align:center}
  .denied h3{font-size:18px; margin-bottom:8px}
  .denied p{font-size:13.5px; color:var(--muted)}
  .hidden{display:none !important}
</style>
</head>
<body>
<canvas id="bgArt"></canvas>

<div id="gate">
  <div class="gate-card glass">
    <div class="logo">M1S</div>
    <h2>SOP Hub</h2>
    <p>Metro1's process library — sign in with your Metro1 Microsoft account. Access is by assigned role.</p>
    <button id="loginBtn">Sign in with Microsoft</button>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-sub">Internal use only</div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="bar glass">
    <div class="brand">M1S <b>· SOP HUB</b></div>
    <div class="who"><b id="whoName">—</b><span class="role-pill" id="whoRole">—</span><br>
      <span id="testWrap" class="hidden">Test as: <select id="userPick" style="font-family:inherit;font-size:12px;padding:3px 6px;border-radius:8px;border:1px solid var(--edge)"></select></span>
      <button class="signout hidden" id="signOut">Sign out</button>
    </div>
  </header>
  <div class="layout">
    <aside class="side glass"><h2>Departments</h2><div id="nav"></div></aside>
    <main class="content glass" id="content"></main>
  </div>
</div>

<div id="viewer"><div class="v-card glass">
  <div class="v-head"><div class="v-title" id="vTitle">—</div>
    <div class="v-actions"><a id="vOpen" href="#" target="_blank" rel="noopener">Open in SharePoint</a><button id="vClose">Close</button></div>
  </div>
  <div class="v-body" id="vBody"></div>
</div></div>

<script>
/* ════════════════════════════════════════════════════════════════
   CONFIG — fill these after registering the app:
   1) clientId: new app registration (SPA platform, redirect = this page's URL)
   2) API permissions (delegated): openid, profile, email, Files.Read.All
      -> Grant admin consent.
   3) App roles created + assigned, Assignment Required = Yes.
   4) Each SOP url: the SharePoint SHARE LINK of the doc ("People in
      Metro1 with the link can view"). The page exchanges it via Graph
      for an embedded preview — docs never live on GitHub.
   ════════════════════════════════════════════════════════════════ */
const MSAL_CONFIG = {
  auth:{
    clientId:"5e88eae1-62ee-4c86-b48e-587dc5383c4c",
    authority:"https://login.microsoftonline.com/eeea7e3e-9ccb-4a16-894e-3417c6a7a4c1",
    redirectUri:window.location.origin + window.location.pathname
  },
  cache:{cacheLocation:"localStorage"}
};
const GRAPH_SCOPES = ["openid","profile","email","Files.Read.All"];
const TEST_MODE = MSAL_CONFIG.auth.clientId.indexOf("PASTE_")===0;

const ROLE_RULES = {
  "SOP.Admin":             {role:"admin",  departments:["*"]},
  "SOP.Viewer.All":        {role:"viewer", departments:["*"]},
  "SOP.Viewer.Design":     {role:"viewer", departments:["Design"]},
  "SOP.Viewer.Sales":      {role:"viewer", departments:["Sales"]},
  "SOP.Viewer.Production": {role:"viewer", departments:["Production"]},
  "SOP.Viewer.Logistics":  {role:"viewer", departments:["Logistics"]},
  "SOP.Viewer.Finance":    {role:"viewer", departments:["Finance"]},
  "SOP.Viewer.HR":         {role:"viewer", departments:["HR"]},
};

const DEPTS = {
  Sales:{color:"var(--sales)"}, Design:{color:"var(--design)"},
  Production:{color:"var(--production)"}, Logistics:{color:"var(--logistics)"},
  Finance:{color:"var(--finance)"}, HR:{color:"var(--hr)"},
};

const FLOW = [
  /* ── Sales: inventory report → process order → compliance & routing → order tracking ── */
  {dept:"Sales", stage:"1 — Inventory Report", sops:[
    {name:"Inventory Report", desc:"Pulling and reviewing the inventory report before committing to orders.", url:""}]},
  {dept:"Sales", stage:"2 — Process Order", sops:[
    {name:"Order Processing", desc:"Entering and processing a customer order.", url:""}]},
  {dept:"Sales", stage:"3 — Compliance & Routing", sops:[
    {name:"Compliance & Routing", desc:"Customer compliance requirements and routing setup before shipment.", url:""}]},
  {dept:"Sales", stage:"4 — Order Tracking", sops:[
    {name:"Order Tracking", desc:"Monitoring open orders through to delivery.", url:""}]},

  /* ── Design ── */
  {dept:"Design", stage:"1 — Artwork", sops:[
    {name:"Artwork", desc:"Receiving, validating, and managing artwork files.", url:""}]},

  /* ── Production: quoting → development → production → inspection ── */
  {dept:"Production", stage:"1 — Quoting", sops:[
    {name:"Quoting", desc:"Quoting items out to factories and tracking responses (Quoting Tracker / Quote Sheet Directory).", url:""}]},
  {dept:"Production", stage:"2 — Development", sops:[
    {name:"Development", desc:"Samples and pre-production approvals (Development Tracker: SF/BS/BF/FF/PPS).", url:""}]},
  {dept:"Production", stage:"3 — Production", sops:[
    {name:"Production & PO Tracking", desc:"Mass production to ready-to-ship: PI status, carton marks, batch #, tickets, CRD dates.", url:""}]},
  {dept:"Production", stage:"4 — Inspection", sops:[
    {name:"Inspection", desc:"QC bookings and results by PO/style. NYC sets up, HK executes; failures re-entered as Reinspection.", url:""}]},

  /* ── Logistics: container planning → container clearance → warehouse ── */
  {dept:"Logistics", stage:"1 — Container Planning", sops:[
    {name:"Container Planning", desc:"Plan/book containers, weekly CBM + ready dates from factories.", url:""}]},
  {dept:"Logistics", stage:"2 — Container Clearance", sops:[
    {name:"Container Clearance", desc:"Docs, telex/release, customs clearance through arrival.", url:""}]},
  {dept:"Logistics", stage:"3 — Warehouse", sops:[
    {name:"Warehouse Receiving", desc:"Receipt at warehouse, check-in, and closing the container record.", url:""}]},

  /* ── Finance: factory invoice → customer invoice ── */
  {dept:"Finance", stage:"1 — Factory Invoice", sops:[
    {name:"Factory Invoice", desc:"Receiving, matching, and paying factory invoices.", url:""}]},
  {dept:"Finance", stage:"2 — Customer Invoice", sops:[
    {name:"Customer Invoice", desc:"Issuing customer invoices and tracking collection.", url:""}]},

  /* ── HR: new hire → offboarding ── */
  {dept:"HR", stage:"1 — New Hire", sops:[
    {name:"New Hire Onboarding", desc:"Account setup, access (M1S All Staff + SOP role), equipment, and first-week checklist.", url:""}]},
  {dept:"HR", stage:"2 — Offboarding", sops:[
    {name:"Offboarding", desc:"Disabling accounts, recovering equipment, and transfer of responsibilities.", url:""}]},
];

const DECISIONS = {
  Sales:{start:"s1",nodes:{
    s1:{q:"Is this a new order or an existing one?",opts:[
      {label:"New order",goto:"s2"},
      {label:"Existing order",goto:{sop:"Order Tracking"}}]},
    s2:{q:"Have you checked stock availability?",opts:[
      {label:"Not yet",goto:{sop:"Inventory Report"}},
      {label:"Yes – stock confirmed",goto:"s3"}]},
    s3:{q:"Does this customer have compliance/routing requirements?",opts:[
      {label:"Yes / not sure",goto:{sop:"Compliance & Routing"}},
      {label:"No",goto:{sop:"Order Processing"}}]}}},
  Design:{start:"d1",nodes:{
    d1:{q:"What do you need?",opts:[
      {label:"Artwork process & file standards",goto:{sop:"Artwork"}}]}}},
  Production:{start:"p1",nodes:{
    p1:{q:"Where is the item in its lifecycle?",opts:[
      {label:"Needs factory pricing",goto:{sop:"Quoting"}},
      {label:"Quoted – needs samples/approvals",goto:{sop:"Development"}},
      {label:"PPS approved – in mass production",goto:{sop:"Production & PO Tracking"}},
      {label:"Ready – needs QC",goto:{sop:"Inspection"}}]}}},
  Logistics:{start:"l1",nodes:{
    l1:{q:"Where is the container in its lifecycle?",opts:[
      {label:"Planning / collecting CBM + ready dates",goto:{sop:"Container Planning"}},
      {label:"On water – docs & clearance",goto:{sop:"Container Clearance"}},
      {label:"Arrived – receiving",goto:{sop:"Warehouse Receiving"}}]}}},
  Finance:{start:"f1",nodes:{
    f1:{q:"Which side of the invoice?",opts:[
      {label:"Paying a factory",goto:{sop:"Factory Invoice"}},
      {label:"Billing a customer",goto:{sop:"Customer Invoice"}}]}}},
  HR:{start:"h1",nodes:{
    h1:{q:"Is someone joining or leaving?",opts:[
      {label:"Joining",goto:{sop:"New Hire Onboarding"}},
      {label:"Leaving",goto:{sop:"Offboarding"}}]}}},
};

/* Test users (only used before clientId is configured) */
const PEOPLE = [
  {name:"Test: Admin (all)", role:"admin", departments:["*"]},
  {name:"Test: Viewer (Sales)", role:"viewer", departments:["Sales"]},
  {name:"Test: Viewer (Prod)", role:"viewer", departments:["Production"]},
  {name:"Test: Viewer (Logistics)", role:"viewer", departments:["Logistics"]},
];

/* ───────────────────── generative background (seeded flow field) ───────────────────── */
(function(){
  const c=document.getElementById('bgArt'), x=c.getContext('2d');
  let W,H; function fit(){W=c.width=innerWidth;H=c.height=innerHeight;} fit(); addEventListener('resize',fit);
  let seed=20260610; function rnd(){seed=(seed*1664525+1013904223)>>>0; return seed/4294967296;}
  const hues=[[47,155,214],[148,102,214],[54,163,122],[242,115,74]];
  const pts=[]; for(let i=0;i<70;i++){const h=hues[Math.floor(rnd()*hues.length)];
    pts.push({x:rnd()*innerWidth,y:rnd()*innerHeight,a:rnd()*Math.PI*2,s:.25+rnd()*.4,c:h,r:.6+rnd()*1.4});}
  function field(px,py,t){return Math.sin(px*.0016+t*.00012)*1.7+Math.cos(py*.0019-t*.00009)*1.7;}
  let t=0;
  function tick(){
    t++;
    x.fillStyle='rgba(245,247,250,0.045)'; x.fillRect(0,0,W,H);
    pts.forEach(p=>{
      const a=field(p.x,p.y,t);
      p.x+=Math.cos(a)*p.s; p.y+=Math.sin(a)*p.s;
      if(p.x<-10)p.x=W+10; if(p.x>W+10)p.x=-10; if(p.y<-10)p.y=H+10; if(p.y>H+10)p.y=-10;
      x.beginPath(); x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle='rgba('+p.c[0]+','+p.c[1]+','+p.c[2]+',0.18)'; x.fill();
    });
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ───────────────────── auth ───────────────────── */
let msalApp=null, account=null, current=null, activeDept=null;
const gate=document.getElementById('gate'), app=document.getElementById('app');
const navEl=document.getElementById('nav'), contentEl=document.getElementById('content');
const pick=document.getElementById('userPick');

function resolveRoles(tokenRoles){
  let role=null, departments=[];
  (tokenRoles||[]).forEach(r=>{
    const rule=ROLE_RULES[r]; if(!rule) return;
    if(rule.role==="admin") role="admin";
    else if(!role) role="viewer";
    rule.departments.forEach(d=>{ if(!departments.includes(d)) departments.push(d); });
  });
  if(departments.includes("*")) departments=["*"];
  return {role, departments};
}

async function initAuth(){
  document.getElementById('loginBtn').onclick=doLogin;
  if(TEST_MODE){
    PEOPLE.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p.name;pick.appendChild(o);});
    document.getElementById('testWrap').classList.remove('hidden');
    pick.onchange=()=>applyTestUser(+pick.value);
    gate.classList.add('hidden'); app.classList.remove('hidden');
    applyTestUser(0);
    return;
  }
  msalApp=new msal.PublicClientApplication(MSAL_CONFIG);
  await msalApp.initialize();
  try{const res=await msalApp.handleRedirectPromise(); if(res&&res.account){enter(res.account); return;}}catch(e){}
  const accts=msalApp.getAllAccounts();
  if(accts.length){enter(accts[0]);}
}
async function doLogin(){
  const errEl=document.getElementById('gateErr'); errEl.textContent='';
  try{
    const res=await msalApp.loginPopup({scopes:GRAPH_SCOPES});
    if(res&&res.account) enter(res.account);
  }catch(e){
    if(e&&(e.errorCode==='popup_window_error'||e.errorCode==='empty_window_error')){
      msalApp.loginRedirect({scopes:GRAPH_SCOPES});
    } else { errEl.textContent='Sign-in failed: '+(e.errorMessage||e.message||e); }
  }
}
function enter(acct){
  account=acct;
  const claims=acct.idTokenClaims||{};
  const resolved=resolveRoles(claims.roles);
  if(!resolved.role||!resolved.departments.length){
    // signed in but no role: hard stop — never reaches the hub
    gate.querySelector('.gate-card').innerHTML=
      '<div class="logo">M1S</div><h2>No access</h2>'+
      '<p>You\u2019re signed in as <b>'+acct.username+'</b> but no SOP role is assigned to your account.<br><br>Ask Saul to assign you a role in Entra, then sign in again.</p>'+
      '<button onclick="signOut()">Sign out</button>';
    return;
  }
  current={name:claims.name||acct.username, role:resolved.role, departments:resolved.departments};
  gate.classList.add('hidden'); app.classList.remove('hidden');
  document.getElementById('signOut').classList.remove('hidden');
  document.getElementById('signOut').onclick=signOut;
  paintUser();
}
function signOut(){ if(msalApp) msalApp.logoutRedirect(); }
function applyTestUser(i){ current=PEOPLE[i]; paintUser(); }
function paintUser(){
  document.getElementById('whoName').textContent=current.name;
  document.getElementById('whoRole').textContent=current.role.toUpperCase();
  const vis=visibleDepts(); activeDept=vis.includes(activeDept)?activeDept:vis[0];
  renderNav(); renderContent();
}

/* ───────────────────── rendering ───────────────────── */
function canSee(d){return current.departments.includes('*')||current.departments.includes(d);}
function visibleDepts(){return Object.keys(DEPTS).filter(canSee);}
function renderNav(){
  navEl.innerHTML='';
  visibleDepts().forEach(d=>{
    const count=FLOW.filter(f=>f.dept===d).reduce((n,f)=>n+f.sops.length,0);
    const it=document.createElement('div');
    it.className='nav-item'+(d===activeDept?' active':'');
    it.innerHTML='<span class="dot" style="background:'+DEPTS[d].color+'"></span>'+d+'<span class="nav-count">'+count+'</span>';
    it.onclick=()=>{activeDept=d;renderNav();renderContent();};
    navEl.appendChild(it);
  });
}
function renderContent(){
  const d=activeDept, color=DEPTS[d].color;
  const stages=FLOW.filter(f=>f.dept===d);
  let html='<h2 class="dept-title">'+d+'</h2><div class="dept-sub">Standard operating procedures — click a card to view the document here.</div>';
  stages.forEach(st=>{ st.sops.forEach(s=>{
    const has=s.url&&s.url.trim()!=="";
    html+='<button class="sop" style="--accent:'+color+'" data-sop="'+s.name.replace(/"/g,'&quot;')+'">'+
      '<div class="sop-name"><span>'+s.name+'</span><span class="badge '+(has?'view':'todo')+'">'+(has?'VIEW':'LINK PENDING')+'</span></div>'+
      '<div class="sop-desc">'+st.stage+' — '+s.desc+'</div></button>';
  });});
  if(DECISIONS[d]) html+='<div class="flowwrap"><h3>Decision guide</h3><div class="fsub">Answer the prompts to reach the right SOP.</div><div id="qhost"></div></div>';
  contentEl.innerHTML=html;
  contentEl.querySelectorAll('.sop').forEach(b=>{ b.onclick=()=>openSop(b.dataset.sop); });
  if(DECISIONS[d]) renderQ(d,DECISIONS[d].start);
}
function findSop(name){for(const f of FLOW){for(const s of f.sops){if(s.name===name)return s;}}return null;}

function renderQ(dept,nodeId){
  const host=document.getElementById('qhost'); if(!host)return;
  const node=DECISIONS[dept].nodes[nodeId];
  let h='<div class="qcard glass"><div class="qstep">QUESTION</div><div class="qtext">'+node.q+'</div><div class="qbtns">';
  node.opts.forEach((o,i)=>{h+='<button class="qbtn" data-i="'+i+'">'+o.label+'</button>';});
  h+='</div><button class="qrestart">Start over</button></div>';
  host.innerHTML=h;
  host.querySelectorAll('.qbtn').forEach(b=>{b.onclick=()=>{
    const o=node.opts[+b.dataset.i];
    if(typeof o.goto==='string') renderQ(dept,o.goto);
    else if(o.goto.sop){
      host.innerHTML='<div class="qcard glass"><div class="qstep" style="color:#1d7a55">RESULT</div>'+
        '<div class="rlabel">Open this SOP:</div>'+
        '<button class="sop" style="--accent:'+DEPTS[dept].color+'" data-sop="'+o.goto.sop+'"><div class="sop-name"><span>'+o.goto.sop+'</span><span class="badge view">VIEW</span></div></button>'+
        '<button class="qrestart">Start over</button></div>';
      host.querySelector('.sop').onclick=()=>openSop(o.goto.sop);
      host.querySelector('.qrestart').onclick=()=>renderQ(dept,DECISIONS[dept].start);
    }
    else if(o.goto.done){
      host.innerHTML='<div class="qcard glass"><div class="qstep" style="color:#9466d6">RESULT</div><div class="qtext" style="font-weight:400;font-size:14.5px">'+o.goto.done+'</div><button class="qrestart">Start over</button></div>';
      host.querySelector('.qrestart').onclick=()=>renderQ(dept,DECISIONS[dept].start);
    }
  };});
  host.querySelector('.qrestart').onclick=()=>renderQ(dept,DECISIONS[dept].start);
}

/* ───────────────────── in-page document viewer (Graph preview) ───────────────────── */
const viewer=document.getElementById('viewer');
document.getElementById('vClose').onclick=()=>{viewer.classList.remove('open');document.getElementById('vBody').innerHTML='';};
viewer.onclick=e=>{if(e.target===viewer){viewer.classList.remove('open');document.getElementById('vBody').innerHTML='';}};

async function graphToken(){
  try{ return (await msalApp.acquireTokenSilent({scopes:GRAPH_SCOPES,account})).accessToken; }
  catch(e){ return (await msalApp.acquireTokenPopup({scopes:GRAPH_SCOPES,account})).accessToken; }
}
function encodeShareUrl(u){
  // Graph "shares" encoding: base64url of the link, prefixed u!
  const b=btoa(unescape(encodeURIComponent(u))).replace(/=+$/,'').replace(/\//g,'_').replace(/\+/g,'-');
  return 'u!'+b;
}
async function openSop(name){
  const s=findSop(name); if(!s) return;
  document.getElementById('vTitle').textContent=name;
  const body=document.getElementById('vBody');
  const openLink=document.getElementById('vOpen');
  viewer.classList.add('open');
  if(!s.url||!s.url.trim()){
    openLink.style.display='none';
    body.innerHTML='<div class="v-msg">No document linked yet for this SOP.<br>Add its SharePoint share link in the file\u2019s FLOW config.</div>';
    return;
  }
  openLink.style.display=''; openLink.href=s.url;
  if(TEST_MODE){
    body.innerHTML='<div class="v-msg">In-page preview activates once the app is configured with a Client ID.<br>For now, use \u201cOpen in SharePoint\u201d.</div>';
    return;
  }
  body.innerHTML='<div class="v-msg">Loading preview\u2026</div>';
  try{
    const tk=await graphToken();
    const r=await fetch('https://graph.microsoft.com/v1.0/shares/'+encodeShareUrl(s.url)+'/driveItem/preview',
      {method:'POST',headers:{Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:'{}'});
    if(!r.ok) throw new Error('Graph preview failed ('+r.status+')');
    const j=await r.json();
    if(j.getUrl){ body.innerHTML='<iframe src="'+j.getUrl+'" allowfullscreen></iframe>'; }
    else throw new Error('No preview URL returned');
  }catch(e){
    body.innerHTML='<div class="v-msg">Couldn\u2019t load the in-page preview ('+ (e.message||e) +').<br>This usually means you don\u2019t have SharePoint access to this file \u2014 or the link type isn\u2019t shareable.<br>Try \u201cOpen in SharePoint\u201d.</div>';
  }
}

initAuth();
</script>
