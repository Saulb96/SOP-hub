<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M1S · SOP Hub</title>
<link rel="icon" type="image/png" href="favicon.png">

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<style>
  :root{
    --ink:#16202c; --muted:#5f6c7d;
    --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.45);
    --edge:rgba(255,255,255,.75); --shadow:0 8px 32px rgba(31,45,75,.12);
    --design:#f2734a; --sales:#e0a92e; --production:#2f9bd6;
    --logistics:#36a37a; --finance:#9466d6; --hr:#d6608f; --accentink:#1b6fae;
    --design-deep:#c24e28; --sales-deep:#96690c; --production-deep:#1b76ac;
    --logistics-deep:#1f7d5a; --finance-deep:#7a4cc0; --hr-deep:#b8447a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    color:var(--ink); overflow-x:hidden;
    background:linear-gradient(135deg,#e8f0fa 0%,#f3eef9 45%,#eaf6f1 100%);
  }
  #bgArt{position:fixed; inset:0; z-index:0; opacity:.55; pointer-events:none}
  .glass{
    background:var(--glass); backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid var(--edge); box-shadow:var(--shadow); border-radius:20px;
  }

  /* ---------- Login gate ---------- */
  #gate{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:20px;
    background:linear-gradient(135deg,#e8f0fa 0%,#f3eef9 45%,#eaf6f1 100%)}
  .gate-card{max-width:380px; width:100%; padding:42px 40px; text-align:center}
  .gate-card .logo{font-size:13px; letter-spacing:.35em; font-weight:700; color:var(--accentink); margin-bottom:14px}
  .gate-card h2{font-size:24px; font-weight:700; letter-spacing:-.4px; margin-bottom:8px}
  .gate-card p{font-size:13.5px; color:var(--muted); line-height:1.55; margin-bottom:24px}
  .gate-card button{
    font-family:inherit; font-size:14px; font-weight:600; padding:12px 28px; border-radius:13px;
    border:1px solid var(--edge); cursor:pointer; color:#fff;
    background:linear-gradient(135deg,#2f9bd6,#1b6fae); box-shadow:0 6px 20px rgba(31,111,174,.35);
    transition:.15s;
  }
  .gate-card button:hover{transform:translateY(-1px); box-shadow:0 9px 26px rgba(31,111,174,.45)}
  .gate-err{margin-top:14px; font-size:12px; color:#b4452f; min-height:16px}
  .gate-sub{margin-top:18px; font-size:11px; color:var(--muted)}

  /* ---------- App shell ---------- */
  #app{position:relative; z-index:1; min-height:100vh; padding:26px clamp(14px,3vw,38px)}
  header.bar{display:flex; align-items:center; gap:16px; padding:16px 22px; margin-bottom:22px}
  .brand{font-size:12px; letter-spacing:.32em; font-weight:700; color:var(--accentink)}
  .brand b{color:var(--ink)}
  h1{font-size:19px; font-weight:700; letter-spacing:-.3px}
  .who{margin-left:auto; text-align:right; font-size:12.5px; color:var(--muted)}
  .who b{color:var(--ink); font-weight:600}
  .role-pill{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.08em; padding:3px 9px;
    border-radius:8px; background:rgba(47,155,214,.14); color:var(--accentink); margin-left:7px}
  .signout{font-size:11.5px; color:var(--muted); text-decoration:underline; cursor:pointer; background:none; border:none; font-family:inherit}

  .toolbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 14px; margin-bottom:16px}
  #nav{display:flex; gap:5px; flex-wrap:wrap}
  .nav-item{display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:12px; cursor:pointer; font-family:inherit; color:var(--ink);
    font-size:13.5px; font-weight:500; transition:.13s; border:1px solid transparent; background:none}
  .nav-item:hover{background:var(--glass2); border-color:var(--edge)}
  .nav-item.active{background:rgba(255,255,255,.85); border-color:var(--edge); box-shadow:0 4px 14px rgba(31,45,75,.10); font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%; flex:0 0 auto}
  .nav-count{font-size:11px; color:var(--muted)}
  .tools{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .tools .qbtn{padding:7px 13px}
  .own{display:flex; gap:6px; align-items:center; font-size:13px; color:var(--muted); cursor:pointer; margin-right:4px}

  .content{padding:22px 24px; min-height:60vh}
  .dept-head{display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:14px}
  .dept-title{font-size:24px; font-weight:700; letter-spacing:-.4px; margin-bottom:4px}
  .dept-sub{font-size:13px; color:var(--muted); margin-bottom:20px}
  .dept-head .dept-sub{margin-bottom:0}
  .head-edit{margin-left:auto; display:flex; gap:10px; align-items:center}

  /* ---------- Workflow board ---------- */
  .lane-title{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; margin:20px 0 8px}
  .canvas{border-radius:16px; padding:18px; overflow-x:auto; border:1px solid var(--edge); background-color:rgba(255,255,255,.28);
    background-image:radial-gradient(rgba(95,108,125,.24) 1px,transparent 1.3px); background-size:18px 18px}
  .board{display:flex; align-items:flex-start; min-width:max-content}
  .stage{width:205px; flex:0 0 auto; padding:12px 10px 10px; border-radius:16px; background:rgba(255,255,255,.72); border:1px solid var(--edge);
    border-top:4px solid var(--c); box-shadow:0 6px 20px rgba(31,45,75,.10); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
  .stage-title{display:flex; gap:7px; align-items:baseline; font-size:13.5px; font-weight:700; padding:0 3px 2px; line-height:1.25}
  .stage-title .dot{width:8px; height:8px; position:relative; top:-1px}
  .arrow{flex:0 0 34px; height:2px; margin-top:42px; background:#8aa0b8; position:relative}
  .arrow::after{content:""; position:absolute; right:0; top:-4px; border-left:7px solid #8aa0b8; border-top:5px solid transparent; border-bottom:5px solid transparent}
  .step,.decision{display:block; width:100%; text-align:left; font-family:inherit; border:none; cursor:pointer; color:#fff; margin-top:8px; transition:.13s}
  .step{background:var(--fill); border-radius:11px; padding:9px 11px; box-shadow:0 3px 10px rgba(31,45,75,.16)}
  .step:hover,.step.sel{transform:translateY(-1px); box-shadow:0 7px 18px rgba(31,45,75,.28)}
  .step.sel{outline:2px solid var(--ink); outline-offset:2px}
  .step b,.decision b{display:block; font-size:13.5px; font-weight:600; line-height:1.3}
  .step-owner{display:block; font-size:12.5px; margin-top:2px; color:rgba(255,255,255,.9)}
  .no-owners .step-owner{display:none}
  .step-tag{display:inline-block; font-size:10.5px; font-weight:600; margin-top:6px; padding:2px 7px; border-radius:6px; background:rgba(255,255,255,.2)}
  .decision{background:var(--ink); padding:11px 22px 10px; position:relative;
    clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,13px 100%,0 50%)}
  .decision:hover,.decision:focus-visible{background:#2d3d52}
  .decision i{display:block; width:8px; height:8px; background:#e0a92e; transform:rotate(45deg); margin:0 0 5px 1px}
  .decision span{display:block; font-size:12px; margin-top:3px; color:rgba(255,255,255,.8)}
  .board-note{font-size:12.5px; color:var(--muted); margin-top:14px}
  @media(max-width:760px){
    .content{padding:18px 14px}
    .canvas{padding:12px}
    .board{flex-direction:column; align-items:stretch; min-width:0}
    .stage{width:100%}
    .arrow{flex:0 0 22px; width:2px; height:22px; margin:0 auto}
    .arrow::after{right:-4px; top:auto; bottom:0; border-top:7px solid #8aa0b8; border-left:5px solid transparent; border-right:5px solid transparent; border-bottom:0}
    .tools{margin-left:0}
  }

  /* ---------- Side panel ---------- */
  #scrim{position:fixed; inset:0; z-index:64; background:rgba(22,32,44,.18); display:none}
  #scrim.open{display:block}
  #panel{position:fixed; top:0; right:0; bottom:0; z-index:65; width:min(400px,100vw); padding:24px 22px; overflow-y:auto; display:none;
    background:rgba(255,255,255,.94); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:-10px 0 34px rgba(31,45,75,.18)}
  #panel.open{display:block}
  #pClose{position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%; border:1px solid #dfe5ec; background:#fff; cursor:pointer; font-size:13px; color:var(--ink); font-family:inherit}
  .p-kick{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--muted); margin:0 36px 8px 0; display:flex; gap:7px; align-items:center}
  .p-title{font-size:20px; font-weight:700; letter-spacing:-.3px; line-height:1.25; margin:0 30px 8px 0}
  .p-desc{font-size:13.5px; color:#3c4858; line-height:1.55}
  .p-h{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--muted); margin:20px 0 7px}
  .p-val{font-size:14px}
  .p-none{font-size:13px; color:var(--muted); font-style:italic}
  .p-link{display:flex; gap:9px; align-items:center; width:100%; text-align:left; font:inherit; font-size:13.5px; font-weight:500; color:var(--ink); padding:10px 12px; margin-bottom:7px;
    border-radius:11px; border:1px solid #dfe5ec; background:#fff; cursor:pointer; transition:.13s}
  .p-link:hover{box-shadow:0 4px 12px rgba(31,45,75,.12); transform:translateY(-1px)}
  .p-group{margin-bottom:6px}

  .sop{width:100%; text-align:left; font-family:inherit; background:rgba(255,255,255,.7); border:1px solid var(--edge);
    border-left:4px solid var(--accent,#2f9bd6); border-radius:15px; padding:15px 17px; cursor:pointer;
    display:block; margin-bottom:11px; transition:.15s; color:var(--ink)}
  .sop:hover{transform:translateX(3px); box-shadow:0 6px 18px rgba(31,45,75,.12); background:rgba(255,255,255,.9)}
  .sop-name{font-size:14.5px; font-weight:600; display:flex; justify-content:space-between; gap:10px; align-items:center}
  .badge{font-size:10px; font-weight:700; letter-spacing:.05em; padding:3px 8px; border-radius:7px; white-space:nowrap}
  .badge.view{background:rgba(54,163,122,.15); color:#1d7a55}
  .badge.todo{background:rgba(224,169,46,.16); color:#9a6e0d}
  .sop-desc{font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.5}
  .ed-in{width:100%; font:inherit; font-size:12.5px; border:1px solid var(--edge); border-radius:8px; padding:6px 8px; margin-bottom:6px}
  .ed-guides{font-size:12px; color:var(--muted); margin-top:2px}
  .ed-guides summary{cursor:pointer}
  .ed-guides label{display:flex; gap:6px; align-items:center; margin-top:4px; color:var(--ink)}

  /* ---------- Decision flow ---------- */
  .flowwrap{margin-top:28px; padding-top:20px; border-top:1px dashed rgba(95,108,125,.35)}
  .flowwrap h3{font-size:16px; font-weight:700; margin-bottom:3px}
  .fsub{font-size:12.5px; color:var(--muted); margin-bottom:14px}
  .qcard{padding:20px 22px; max-width:540px}
  .qstep{font-size:10.5px; font-weight:700; letter-spacing:.14em; color:var(--accentink); margin-bottom:8px}
  .qtext{font-size:15.5px; font-weight:600; margin-bottom:15px}
  .qbtns{display:flex; gap:9px; flex-wrap:wrap}
  .qbtn{font-family:inherit; font-size:13px; font-weight:500; padding:9px 16px; border-radius:12px;
    border:1px solid var(--edge); background:rgba(255,255,255,.75); cursor:pointer; transition:.13s}
  .qbtn:hover{background:#fff; transform:translateY(-1px); box-shadow:0 4px 12px rgba(31,45,75,.1)}
  .qrestart{margin-top:13px; font-size:12px; color:var(--muted); background:none; border:none; cursor:pointer; text-decoration:underline; font-family:inherit}
  .rlabel{font-size:12px; color:var(--muted); margin-bottom:8px}

  /* ---------- In-page viewer ---------- */
  #viewer{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; padding:3vh 3vw;
    background:rgba(22,32,44,.45); backdrop-filter:blur(6px)}
  #viewer.open{display:flex}
  .v-card{width:min(850px,94vw); height:min(95vh,1100px); display:flex; flex-direction:column; overflow:hidden; border-radius:20px; position:relative; margin:auto}
  #vClose{position:absolute; top:10px; right:10px; z-index:5; width:34px; height:34px; border-radius:50%;
    border:1px solid var(--edge); background:rgba(255,255,255,.92); cursor:pointer; font-size:14px; color:var(--ink);
    box-shadow:0 3px 10px rgba(20,30,50,.18); font-family:inherit}
  #vClose:hover{background:#fff}
  .v-body{flex:1; background:#525659; display:flex; align-items:center; justify-content:center}
  .v-body iframe{width:100%; height:100%; border:0}
  .v-msg{display:flex; height:100%; align-items:center; justify-content:center; color:var(--muted); font-size:14px; text-align:center; padding:30px}

  .denied{padding:40px; text-align:center}
  .denied h3{font-size:18px; margin-bottom:8px}
  .denied p{font-size:13.5px; color:var(--muted)}
  /* flow editor */
  .fe-node{background:rgba(255,255,255,.85); border:1px solid var(--edge); border-radius:13px; padding:12px 14px; margin-bottom:10px; position:relative}
  .fe-node.start::before{content:"START"; position:absolute; top:-8px; left:12px; font-size:9px; font-weight:700; letter-spacing:.1em;
    background:var(--accentink); color:#fff; padding:2px 7px; border-radius:6px}
  .fe-id{font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.08em; margin-bottom:5px}
  .fe-node input,.fe-node select{font:inherit; font-size:12.5px; border:1px solid var(--edge); border-radius:8px; padding:5px 7px; background:#fff}
  .fe-q{width:100%; font-weight:600 !important; margin-bottom:8px}
  .fe-opt{display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap}
  .fe-opt input{flex:1; min-width:110px}
  .fe-opt select{max-width:180px}
  .fe-mini{font-size:11px; color:var(--muted); background:none; border:none; cursor:pointer; text-decoration:underline; font-family:inherit}
  .fe-mini.red{color:#b4452f}
  .fe-svgwrap{overflow:auto; border:1px solid var(--edge); border-radius:13px; background:rgba(255,255,255,.6); margin-bottom:14px}
  .hidden{display:none !important}
</style>
</head>
<body>
<canvas id="bgArt"></canvas>

<div id="gate">
  <div class="gate-card glass">
    <div class="logo">M1S</div>
    <h2>SOP Hub</h2>
    <p>Metro1's process library — sign in with your Metro1 Microsoft account. Access is by assigned role.</p>
    <button id="loginBtn">Sign in with Microsoft</button>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-sub">Internal use only</div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="bar glass">
    <div class="brand">M1S <b>· SOP HUB</b></div>
    <div class="who"><b id="whoName">—</b><span class="role-pill" id="whoRole">—</span><br>
      <span id="testWrap" class="hidden">Test as: <select id="userPick" style="font-family:inherit;font-size:12px;padding:3px 6px;border-radius:8px;border:1px solid var(--edge)"></select></span>
      <button class="signout hidden" id="signOut">Sign out</button>
    </div>
  </header>
  <div class="toolbar glass">
    <div id="nav"></div>
    <div class="tools">
      <label class="own"><input type="checkbox" id="ownerToggle" checked> Owners</label>
      <button class="qbtn" id="guidesBtn">All guides</button>
      <button class="qbtn" id="glossaryBtn">Glossary</button>
    </div>
  </div>
  <main class="content glass" id="content"></main>
</div>

<div id="scrim"></div>
<aside id="panel" role="dialog" aria-modal="true" aria-label="Details">
  <button id="pClose" title="Close" aria-label="Close">&#10005;</button>
  <div id="pBody"></div>
</aside>

<div id="viewer"><div class="v-card glass">
  <button id="vClose" title="Close">&#10005;</button>
  <div class="v-body" id="vBody"></div>
</div></div>

<script>
/* ════════════════════════════════════════════════════════════════
   CONFIG — fill these after registering the app:
   1) clientId: new app registration (SPA platform, redirect = this page's URL)
   2) API permissions (delegated): openid, profile, email, Files.Read.All
      -> Grant admin consent.
   3) App roles created + assigned, Assignment Required = Yes.
   4) Each SOP url: the SharePoint SHARE LINK of the doc ("People in
      Metro1 with the link can view"). The page exchanges it via Graph
      for an embedded preview — docs never live on GitHub.
   ════════════════════════════════════════════════════════════════ */
const MSAL_CONFIG = {
  auth:{
    clientId:"5e88eae1-62ee-4c86-b48e-587dc5383c4c",
    authority:"https://login.microsoftonline.com/eeea7e3e-9ccb-4a16-894e-3417c6a7a4c1",
    redirectUri:window.location.origin + window.location.pathname
  },
  cache:{cacheLocation:"localStorage"}
};
/* SharePoint URL of sop-config.json in the SOP Library. Open the file once in
   the browser, copy the address bar URL, paste here. Leave "" for built-in config. */
const CONFIG_URL = "https://met1sol.sharepoint.com/sites/Importing/SOP%20Library/sop-config.json";

const GRAPH_SCOPES = ["openid","profile","email","Files.ReadWrite.All"];
const TEST_MODE = MSAL_CONFIG.auth.clientId.indexOf("PASTE_")===0;

const ROLE_RULES = {
  "SOP.Admin":             {role:"admin",  departments:["*"]},
  "SOP.Viewer.All":        {role:"viewer", departments:["*"]},
  "SOP.Viewer.Design":     {role:"viewer", departments:["Design"]},
  "SOP.Viewer.Sales":      {role:"viewer", departments:["Sales"]},
  "SOP.Viewer.Production": {role:"viewer", departments:["Production"]},
  "SOP.Viewer.Logistics":  {role:"viewer", departments:["Logistics"]},
  "SOP.Viewer.Finance":    {role:"viewer", departments:["Finance"]},
  "SOP.Viewer.HR":         {role:"viewer", departments:["HR"]},
};

const DEPTS = {
  Sales:{color:"var(--sales)"}, Design:{color:"var(--design)"},
  Production:{color:"var(--production)"}, Logistics:{color:"var(--logistics)"},
  Finance:{color:"var(--finance)"}, HR:{color:"var(--hr)"},
};

const FLOW = [
  /* ── Sales: inventory report → process order → compliance & routing → order tracking ── */
  {dept:"Sales", stage:"1 — Inventory Report", sops:[
    {name:"Inventory Report", desc:"Pulling and reviewing the inventory report before committing to orders.", url:""}]},
  {dept:"Sales", stage:"2 — Process Order", sops:[
    {name:"Order Processing", desc:"Entering and processing a customer order.", url:""}]},
  {dept:"Sales", stage:"3 — Compliance & Routing", sops:[
    {name:"Compliance & Routing", desc:"Customer compliance requirements and routing setup before shipment.", url:""}]},
  {dept:"Sales", stage:"4 — Order Tracking", sops:[
    {name:"Order Tracking", desc:"Monitoring open orders through to delivery.", url:""}]},

  /* ── Design ── */
  {dept:"Design", stage:"1 — Artwork", sops:[
    {name:"Artwork", desc:"Receiving, validating, and managing artwork files.", url:""}]},

  /* ── Production: quoting → development → production → inspection ── */
  {dept:"Production", stage:"1 — Quoting", sops:[
    {name:"Quoting", desc:"Quoting items out to factories and tracking responses (Quoting Tracker / Quote Sheet Directory).", url:""}]},
  {dept:"Production", stage:"2 — Development", sops:[
    {name:"Development", desc:"Samples and pre-production approvals (the Dev Tracker in Dev PLM: SR/SC/BS/BF/FF).", url:""}]},
  {dept:"Production", stage:"3 — Production", sops:[
    {name:"Production & PO Tracking", desc:"Mass production to ready-to-ship: PI status, carton marks, batch #, tickets, CRD dates.", url:""}]},
  {dept:"Production", stage:"4 — Inspection", sops:[
    {name:"Inspection", desc:"QC bookings and results by PO/style. NYC sets up, HK executes; failures re-entered as Reinspection.", url:""}]},

  /* ── Logistics: container planning → container clearance → warehouse ── */
  {dept:"Logistics", stage:"1 — Container Planning", sops:[
    {name:"Container Planning", desc:"Plan/book containers, weekly CBM + ready dates from factories.", url:""}]},
  {dept:"Logistics", stage:"2 — Container Clearance", sops:[
    {name:"Container Clearance", desc:"Docs, telex/release, customs clearance through arrival.", url:""}]},
  {dept:"Logistics", stage:"3 — Warehouse", sops:[
    {name:"Warehouse Receiving", desc:"Receipt at warehouse, check-in, and closing the container record.", url:""}]},

  /* ── Finance: factory invoice → customer invoice ── */
  {dept:"Finance", stage:"1 — Factory Invoice", sops:[
    {name:"Factory Invoice", desc:"Receiving, matching, and paying factory invoices.", url:""}]},
  {dept:"Finance", stage:"2 — Customer Invoice", sops:[
    {name:"Customer Invoice", desc:"Issuing customer invoices and tracking collection.", url:""}]},

  /* ── HR: new hire → offboarding ── */
  {dept:"HR", stage:"1 — New Hire", sops:[
    {name:"New Hire Onboarding", desc:"Account setup, access (M1S All Staff + SOP role), equipment, and first-week checklist.", url:""}]},
  {dept:"HR", stage:"2 — Offboarding", sops:[
    {name:"Offboarding", desc:"Disabling accounts, recovering equipment, and transfer of responsibilities.", url:""}]},
];

const DECISIONS = {
  Sales:{start:"s1",nodes:{
    s1:{q:"Is this a new order or an existing one?",opts:[
      {label:"New order",goto:"s2"},
      {label:"Existing order",goto:{sop:"Order Tracking"}}]},
    s2:{q:"Have you checked stock availability?",opts:[
      {label:"Not yet",goto:{sop:"Inventory Report"}},
      {label:"Yes – stock confirmed",goto:"s3"}]},
    s3:{q:"Does this customer have compliance/routing requirements?",opts:[
      {label:"Yes / not sure",goto:{sop:"Compliance & Routing"}},
      {label:"No",goto:{sop:"Order Processing"}}]}}},

/* ───────── remote config (sop-config.json in the SOP Library) ───────── */
let CONFIG_ITEM_PATH=null;
function applyConfig(cfg){
  if(cfg.depts){ for(const k in DEPTS) delete DEPTS[k]; Object.assign(DEPTS,cfg.depts); }
  if(cfg.flow){ FLOW.length=0; cfg.flow.forEach(x=>FLOW.push(x)); }
  if(cfg.decisions){ for(const k in DECISIONS) delete DECISIONS[k]; Object.assign(DECISIONS,cfg.decisions); }
}
async function loadRemoteConfig(){
  if(!CONFIG_URL||TEST_MODE) return;
  try{
    const tk=await graphToken();
    const meta=await fetch('https://graph.microsoft.com/v1.0/shares/'+encodeShareUrl(CONFIG_URL)+'/driveItem?$select=id,parentReference',{headers:{Authorization:'Bearer '+tk}});
    if(!meta.ok) throw 0;
    const m=await meta.json();
    CONFIG_ITEM_PATH='https://graph.microsoft.com/v1.0/drives/'+m.parentReference.driveId+'/items/'+m.id;
    const r=await fetch(CONFIG_ITEM_PATH+'/content',{headers:{Authorization:'Bearer '+tk}});
    if(!r.ok) throw 0;
    applyConfig(await r.json());
  }catch(e){ console.warn('Remote config not loaded; using built-in.'); }
}
async function saveRemoteConfig(cfg){
  const tk=await graphToken();
  const r=await fetch(CONFIG_ITEM_PATH+'/content',{method:'PUT',
    headers:{Authorization:'Bearer '+tk,'Content-Type':'application/json'},
    body:JSON.stringify(cfg,null,2)});
  if(!r.ok){
    if(r.status===403) throw new Error('SharePoint refused the write (403): your account lacks edit rights on the config file.');
    throw new Error('Save failed ('+r.status+')');
  }
}

/* ───────────────────── generative background (seeded flow field) ───────────────────── */
(function(){
  const c=document.getElementById('bgArt'), x=c.getContext('2d');
  let W,H; function fit(){W=c.width=innerWidth;H=c.height=innerHeight;} fit(); addEventListener('resize',fit);
  let seed=20260610; function rnd(){seed=(seed*1664525+1013904223)>>>0; return seed/4294967296;}
  const hues=[[47,155,214],[148,102,214],[54,163,122],[242,115,74]];
  const pts=[]; for(let i=0;i<70;i++){const h=hues[Math.floor(rnd()*hues.length)];
    pts.push({x:rnd()*innerWidth,y:rnd()*innerHeight,a:rnd()*Math.PI*2,s:.25+rnd()*.4,c:h,r:.6+rnd()*1.4});}
  function field(px,py,t){return Math.sin(px*.0016+t*.00012)*1.7+Math.cos(py*.0019-t*.00009)*1.7;}
  let t=0;
  function tick(){
    t++;
    x.fillStyle='rgba(245,247,250,0.045)'; x.fillRect(0,0,W,H);
    pts.forEach(p=>{
      const a=field(p.x,p.y,t);
      p.x+=Math.cos(a)*p.s; p.y+=Math.sin(a)*p.s;
      if(p.x<-10)p.x=W+10; if(p.x>W+10)p.x=-10; if(p.y<-10)p.y=H+10; if(p.y>H+10)p.y=-10;
      x.beginPath(); x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle='rgba('+p.c[0]+','+p.c[1]+','+p.c[2]+',0.18)'; x.fill();
    });
    requestAnimationFrame(tick);
  }
  tick();
})();

function resolveRoles(tokenRoles){
  let role=null, departments=[];
  (tokenRoles||[]).forEach(r=>{
    const rule=ROLE_RULES[r]; if(!rule) return;
    if(rule.role==="admin") role="admin";
    else if(!role) role="viewer";
    rule.departments.forEach(d=>{ if(!departments.includes(d)) departments.push(d); });
  });
  if(departments.includes("*")) departments=["*"];
  return {role, departments};
}

  document.getElementById('loginBtn').onclick=doLogin;

  }
  msalApp=new msal.PublicClientApplication(MSAL_CONFIG);

async function doLogin(){

    const res=await msalApp.loginPopup({scopes:GRAPH_SCOPES});
    if(res&&res.account) enter(res.account);
  }catch(e){
    if(e&&(e.errorCode==='popup_window_error'||e.errorCode==='empty_window_error')){
      msalApp.loginRedirect({scopes:GRAPH_SCOPES});
    } else { errEl.textContent='Sign-in failed: '+(e.errorMessage||e.message||e); }
  }

function enter(acct){
  account=acct;
  const claims=acct.idTokenClaims||{};
  const resolved=resolveRoles(claims.roles);
  if(!resolved.role||!resolved.departments.length){
    // signed in but no role: hard stop — never reaches the hub
    gate.querySelector('.gate-card').innerHTML=
      '<div class="logo">M1S</div><h2>No access</h2>'+
      '<p>You\u2019re signed in as <b>'+acct.username+'</b> but no SOP role is assigned to your account.<br><br>Ask Saul to assign you a role in Entra, then sign in again.</p>'+
      '<button onclick="signOut()">Sign out</button>';

/* question order for the black cards: start first, then follow the answers */
function questionOrder(d){
  const D=DECISIONS[d]; if(!D||!D.nodes[D.start]) return [];
  const out=[], queue=[D.start];
  while(queue.length){
    const id=queue.shift();
    if(out.includes(id)||!D.nodes[id]) continue;
    out.push(id);
    D.nodes[id].opts.forEach(o=>{ if(typeof o.goto==='string') queue.push(o.goto); });
  }
  return out;
}
function stepTag(sp){
  const n=guidesFor(sp).length;
  if(n) return n===1?'Guide':n+' guides';
  return hasOwnDoc(sp)?'Document':'No guide yet';
}
function boardHtml(d){
  const color=DEPTS[d].color, cols=[];
  const qs=questionOrder(d);
  if(qs.length){
    cols.push('<div class="stage" style="--c:var(--ink)"><div class="stage-title"><span class="dot" style="background:var(--ink)"></span>Where to start</div>'+
      qs.map(id=>'<button class="decision" data-q="'+esc(d)+'" data-node="'+esc(id)+'"><i></i><b>'+esc(DECISIONS[d].nodes[id].q)+'</b><span>Decision</span></button>').join('')+'</div>');
  }
  FLOW.forEach((st,si)=>{
    if(st.dept!==d) return;
    cols.push('<div class="stage" style="--c:'+color+'"><div class="stage-title"><span class="dot" style="background:'+color+'"></span>'+esc(stageName(st.stage))+'</div>'+
      st.sops.map((sp,pi)=>{
        const owner=stepOwner(sp);

          '<span class="step-owner">'+esc(owner)+'</span>'+
          '<span class="step-tag">'+stepTag(sp)+'</span></button>';
      }).join('')+'</div>');
  });
  return '<div class="canvas"><div class="board">'+cols.join('<div class="arrow"></div>')+'</div></div>';
}

    else if(g&&g.sop&&openStepByName(g.sop)) return;
    else {
      openPanel(kick+'<div class="p-desc" style="margin-bottom:14px">'+esc(g&&(g.done||g.sop))+'</div>'+again);
      document.getElementById('pAgain').onclick=()=>openQuestion(dept,D.start);
    }
  };});
}

  openPanel('<h3 class="p-title">All guides</h3><div class="p-group" style="margin-top:14px">'+list.map(guideLink).join('')+'</div>');

/* ───────────────────── in-page document viewer (Graph preview) ───────────────────── */
const viewer=document.getElementById('viewer');
function closeViewer(){viewer.classList.remove('open');document.getElementById('vBody').innerHTML='';}
document.getElementById('vClose').onclick=closeViewer;
viewer.onclick=e=>{if(e.target===viewer)closeViewer();};
function openGuide(file){
  viewer.classList.add('open');
  document.getElementById('vBody').innerHTML='<iframe src="'+esc(file)+'" style="background:#fff"></iframe>';
}

async function graphToken(){
  try{ return (await msalApp.acquireTokenSilent({scopes:GRAPH_SCOPES,account})).accessToken; }
  catch(e){ return (await msalApp.acquireTokenPopup({scopes:GRAPH_SCOPES,account})).accessToken; }
}
function encodeShareUrl(u){
  // Graph "shares" encoding: base64url of the link, prefixed u!
  const b=btoa(unescape(encodeURIComponent(u))).replace(/=+$/,'').replace(/\//g,'_').replace(/\+/g,'-');
  return 'u!'+b;
}
async function openSop(name){
  const _sp0=findSop(name);
  if(_sp0&&_sp0.url&&!/^https?:/i.test(_sp0.url)){ openGuide(_sp0.url); return; } // repo-relative guide
  const sp=findSop(name); if(!sp) return;
  const body=document.getElementById('vBody');
  viewer.classList.add('open');
  if(!sp.url||!sp.url.trim()){
    body.innerHTML='<div class="v-msg">No document linked yet for this SOP.<br>An admin can add it via Edit.</div>';
    return;
  }
  if(TEST_MODE){
    body.innerHTML='<div class="v-msg">In-page preview activates once the app is configured with a Client ID.</div>';
    return;
  }
  body.innerHTML='<div class="v-msg">Loading document…</div>';
  try{
    const tk=await graphToken();
    const base='https://graph.microsoft.com/v1.0/shares/'+encodeShareUrl(sp.url)+'/driveItem';
    // resolve the item (also tells us the file type)
    const meta=await fetch(base+'?$select=name',{headers:{Authorization:'Bearer '+tk}});
    if(!meta.ok) throw new Error('File not reachable ('+meta.status+')');
    const fileName=(await meta.json()).name||'';
    const isPdf=/\.pdf$/i.test(fileName);
    // fetch content: PDFs as-is; Office docs converted to PDF (clean, chrome-free, read-only)
    const url=base+'/content'+(isPdf?'':'?format=pdf');
    const r=await fetch(url,{headers:{Authorization:'Bearer '+tk}});
    if(!r.ok) throw new Error('convert:'+r.status);
    const blob=await r.blob();
    const obj=URL.createObjectURL(blob.type?blob:new Blob([blob],{type:'application/pdf'}));
    body.innerHTML='<iframe src="'+obj+'#toolbar=0" allowfullscreen></iframe>';
  }catch(e){
    // fallback: Microsoft preview embed (has its own header strip but always works)
    try{
      const tk=await graphToken();
      const r=await fetch('https://graph.microsoft.com/v1.0/shares/'+encodeShareUrl(sp.url)+'/driveItem/preview',
        {method:'POST',headers:{Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:'{}'});
      if(!r.ok) throw 0;
      const j=await r.json();
      if(j.getUrl){ body.innerHTML='<iframe src="'+j.getUrl+'" allowfullscreen></iframe>'; return; }
      throw 0;
    }catch(_){
      body.innerHTML='<div class="v-msg">Couldn\u2019t load this document.<br>This usually means you don\u2019t have SharePoint access to the file \u2014 or the link URL needs checking.</div>';
    }
  }
}

/* ───────── decision flow editor (admin) ───────── */
function feDept(){ return DECISIONS[activeDept] || (DECISIONS[activeDept]={start:"",nodes:{}}); }
function feNewId(){ const D=feDept(); let i=1; while(D.nodes["n"+i]) i++; return "n"+i; }
function feAddNode(){ const D=feDept(); const id=feNewId(); D.nodes[id]={q:"New question?",opts:[{label:"Yes",goto:{done:"Done."}}]}; if(!D.start) D.start=id; renderContent(); }
function feDelNode(id){ if(!confirm("Delete this question?")) return; const D=feDept(); delete D.nodes[id]; if(D.start===id) D.start=Object.keys(D.nodes)[0]||""; renderContent(); }
function feSetStart(id){ feDept().start=id; renderContent(); }
function feSetQ(id,v){ feDept().nodes[id].q=v; }
function feOptLabel(id,i,v){ feDept().nodes[id].opts[i].label=v; }
function feAddOpt(id){ feDept().nodes[id].opts.push({label:"Option",goto:{done:"Done."}}); renderContent(); }
function feDelOpt(id,i){ feDept().nodes[id].opts.splice(i,1); renderContent(); }
function feTargetVal(g){ if(typeof g==="string") return "node:"+g; if(g&&g.sop) return "sop:"+g.sop; return "done"; }
function feSetTarget(id,i,val){
  const o=feDept().nodes[id].opts[i];
  if(val==="done"){ o.goto={done:(o.goto&&o.goto.done)||"Done."}; }
  else if(val.startsWith("node:")){ o.goto=val.slice(5); }
  else if(val.startsWith("sop:")){ o.goto={sop:val.slice(4)}; }
  renderContent();
}
function feSetDone(id,i,v){ feDept().nodes[id].opts[i].goto={done:v}; }
function feTargetOptions(sel){
  const D=feDept(); let h="";
  h+='<optgroup label="Questions">';
  Object.keys(D.nodes).forEach(k=>{ h+='<option value="node:'+k+'"'+(sel==="node:"+k?" selected":"")+'>\u2192 '+k+': '+(D.nodes[k].q||"").slice(0,26)+'</option>'; });
  h+='</optgroup><optgroup label="SOPs">';
  FLOW.filter(f=>f.dept===activeDept).forEach(st=>st.sops.forEach(sp=>{
    h+='<option value="sop:'+sp.name.replace(/"/g,"&quot;")+'"'+(sel==="sop:"+sp.name?" selected":"")+'>\uD83D\uDCC4 '+sp.name+'</option>';}));
  h+='</optgroup><option value="done"'+(sel==="done"?" selected":"")+'>\u25A0 End message</option>';
  return h;
}
function renderFlowEditor(){
  const D=feDept();
  let h='<div class="flowwrap"><h3>Decision guide (editing)</h3><div class="fsub">Boxes = questions. Each answer points to another question, a SOP, or an end message.</div>';
  h+=feDiagram();
  Object.keys(D.nodes).forEach(id=>{
    const n=D.nodes[id];
    h+='<div class="fe-node'+(D.start===id?' start':'')+'"><div class="fe-id">'+id+
       (D.start!==id?' &nbsp;<button class="fe-mini" onclick="feSetStart(\''+id+'\')">make start</button>':'')+
       ' <button class="fe-mini red" style="float:right" onclick="feDelNode(\''+id+'\')">delete</button></div>'+
       '<input class="fe-q" value="'+(n.q||"").replace(/"/g,"&quot;")+'" onchange="feSetQ(\''+id+'\',this.value)">';
    n.opts.forEach((o,i)=>{
      const tv=feTargetVal(o.goto);
      h+='<div class="fe-opt"><input value="'+(o.label||"").replace(/"/g,"&quot;")+'" onchange="feOptLabel(\''+id+'\','+i+',this.value)">'+
         '<select onchange="feSetTarget(\''+id+'\','+i+',this.value)">'+feTargetOptions(tv)+'</select>'+
         (tv==="done"?'<input placeholder="End message" value="'+((o.goto&&o.goto.done)||"").replace(/"/g,"&quot;")+'" onchange="feSetDone(\''+id+'\','+i+',this.value)">':'')+
         '<button class="fe-mini red" onclick="feDelOpt(\''+id+'\','+i+')">\u2715</button></div>';
    });
    h+='<button class="fe-mini" onclick="feAddOpt(\''+id+'\')">+ answer</button></div>';
  });
  h+='<button class="qbtn" onclick="feAddNode()">+ Add question</button></div>';
  return h;
}
/* simple auto-layout diagram: BFS levels from start */
function feDiagram(){
  const D=feDept(); if(!D.start||!D.nodes[D.start]) return "";
  const levels={}, seen={}; let queue=[[D.start,0]];
  const ends=[]; // {label,from}
  while(queue.length){
    const [id,lv]=queue.shift();
    if(seen[id]||!D.nodes[id]) continue; seen[id]=1;
    (levels[lv]=levels[lv]||[]).push({type:"q",id});
    D.nodes[id].opts.forEach(o=>{
      if(typeof o.goto==="string") queue.push([o.goto,lv+1]);
      else (levels[lv+1]=levels[lv+1]||[]).push({type:o.goto.sop?"sop":"done",label:o.goto.sop||o.goto.done,from:id});
    });
  }
  const COLW=210, ROWH=86, PAD=20;
  const pos={}; let maxRow=0, maxLv=0;
  Object.keys(levels).forEach(lv=>{
    levels[lv].forEach((nd,r)=>{ const key=nd.type==="q"?nd.id:("t"+lv+"_"+r);
      nd.key=key; pos[key]={x:PAD+lv*COLW, y:PAD+r*ROWH, nd}; maxRow=Math.max(maxRow,r); maxLv=Math.max(maxLv,+lv); });
  });
  const W=PAD*2+(maxLv+1)*COLW-40, H=PAD*2+(maxRow+1)*ROWH-20;
  let svg='<div class="fe-svgwrap"><svg width="'+Math.max(W,400)+'" height="'+Math.max(H,120)+'" xmlns="http://www.w3.org/2000/svg" style="font-family:inherit">';
  // edges
  Object.keys(levels).forEach(lv=>{ levels[lv].forEach(nd=>{
    if(nd.type!=="q") return;
    D.nodes[nd.id].opts.forEach(o=>{
      let tkey=null;
      if(typeof o.goto==="string"){ tkey=o.goto; }
      else { // find matching terminal at next level
        const cand=(levels[+lv+1]||[]).find(t=>t.type!=="q"&&t.from===nd.id&&t.label===(o.goto.sop||o.goto.done)&&!t.used);
        if(cand){ cand.used=1; tkey=cand.key; } }
      if(tkey&&pos[tkey]&&pos[nd.key]){
        const a=pos[nd.key],b=pos[tkey];
        svg+='<path d="M'+(a.x+170)+' '+(a.y+26)+' C '+(a.x+195)+' '+(a.y+26)+', '+(b.x-25)+' '+(b.y+26)+', '+b.x+' '+(b.y+26)+'" fill="none" stroke="#8aa0b8" stroke-width="1.4"/>'+
          '<text x="'+((a.x+170+b.x)/2)+'" y="'+((a.y+b.y)/2+20)+'" font-size="9" fill="#5f6c7d" text-anchor="middle">'+(o.label||"").slice(0,14)+'</text>';
      }
    });
  });});
  // nodes
  Object.values(pos).forEach(p=>{
    const nd=p.nd;
    if(nd.type==="q"){
      svg+='<rect x="'+p.x+'" y="'+p.y+'" width="170" height="52" rx="12" fill="#fff" stroke="#c6d2e0"/>'+
        '<text x="'+(p.x+10)+'" y="'+(p.y+20)+'" font-size="9" fill="#1b6fae" font-weight="bold">'+nd.id+(feDept().start===nd.id?' \u2022 START':'')+'</text>'+
        '<text x="'+(p.x+10)+'" y="'+(p.y+36)+'" font-size="10" fill="#16202c">'+((D.nodes[nd.id].q||"").slice(0,30))+'</text>';
    } else if(nd.type==="sop"){
      svg+='<rect x="'+p.x+'" y="'+p.y+'" width="170" height="52" rx="12" fill="#e9f7f0" stroke="#9fd4bc"/>'+
        '<text x="'+(p.x+10)+'" y="'+(p.y+22)+'" font-size="9" fill="#1d7a55" font-weight="bold">SOP</text>'+
        '<text x="'+(p.x+10)+'" y="'+(p.y+36)+'" font-size="10" fill="#16202c">'+nd.label.slice(0,28)+'</text>';
    } else {
      svg+='<rect x="'+p.x+'" y="'+p.y+'" width="170" height="52" rx="12" fill="#f3eef9" stroke="#cbb6e8"/>'+
        '<text x="'+(p.x+10)+'" y="'+(p.y+22)+'" font-size="9" fill="#7a4fb0" font-weight="bold">END</text>'+
        '<text x="'+(p.x+10)+'" y="'+(p.y+36)+'" font-size="10" fill="#16202c">'+(nd.label||"").slice(0,28)+'</text>';
    }
  });
  svg+='</svg></div>';
  return svg;
}
